# ===========================
# Server Config
# ===========================
server.port=8080

# ===========================
# Nacos Registry & Config Center
# ===========================
spring.application.name=note_backbond
# TODO: 替换为你的 Nacos 服务器地址（ip:port），注册发现与配置中心共用此地址
spring.cloud.nacos.server-addr=your-nacos-host:8848
# 命名空间：填 Nacos 控制台上 dev 命名空间的【ID】而非显示名
# （若建空间时自定义 ID 恰好是 dev 则直接用 dev；若是自动生成的 UUID 需填 UUID）
spring.cloud.nacos.discovery.namespace=dev
spring.cloud.nacos.discovery.group=DEFAULT_GROUP
# 配置中心：strict 导入 DataId=note_backbond.properties（Nacos 连不上或配置缺失将启动失败）
# 配置内容见项目根目录 config-center/note_backbond.properties，需先粘贴到 Nacos 控制台
spring.config.import=nacos:note_backbond.properties
spring.cloud.nacos.config.namespace=dev

# ===========================
# MyBatis-Plus Config
# ===========================
mybatis-plus.mapper-locations=classpath*:/mapper/**/*.xml
mybatis-plus.type-aliases-package=org.template.model
mybatis-plus.configuration.log-impl=org.apache.ibatis.logging.stdout.StdOutImpl
mybatis-plus.configuration.map-underscore-to-camel-case=true
mybatis-plus.global-config.db-config.id-type=auto
mybatis-plus.type-handlers-package=org.template.handler

# ===========================
# Knife4j Config
# ===========================
knife4j.enable=true
knife4j.setting.language=zh_cn
#===
plugin.loader.enable = true
