# ===========================
# Server Config
# ===========================
server.port=8080

# ===========================
# Nacos Registry & Config Center
# NOTE: comments here are ASCII-only on purpose - .properties files are read
# as ISO-8859-1 by both IDEA and Spring Boot, UTF-8 Chinese would turn to mojibake
# ===========================
spring.application.name=note_backbond
# TODO: replace with your real Nacos server address (ip:port), shared by discovery & config center
spring.cloud.nacos.server-addr=192.144.229.116:8848
# namespace: use the namespace ID from Nacos console, NOT its display name
# (if the namespace was created with custom ID "dev" keep it as-is; otherwise use the UUID)
spring.cloud.nacos.discovery.namespace=dev
spring.cloud.nacos.discovery.group=DEFAULT_GROUP
# config center: strict import of the 3 existing DataIds
# (suffix-less DataId is parsed as properties by default; app fails to start if Nacos unreachable)
spring.config.import=nacos:datasource,nacos:redis-config,nacos:minio
spring.cloud.nacos.config.namespace=dev

# ===========================
# Mail (SMTP) Config
# (no mail config on Nacos yet, kept locally as fallback; Nacos-imported config
#  has higher priority and will override these values once it gets published there)
# ===========================
spring.mail.host=smtp.qq.com
spring.mail.port=587
spring.mail.username=1508583270@qq.com
spring.mail.password=oxyrztbpjanrgjic
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.default-encoding=UTF-8

# ===========================
# MyBatis-Plus Config
# ===========================
mybatis-plus.mapper-locations=classpath*:/mapper/**/*.xml
mybatis-plus.type-aliases-package=org.template.model
mybatis-plus.configuration.log-impl=org.apache.ibatis.logging.stdout.StdOutImpl
mybatis-plus.configuration.map-underscore-to-camel-case=true
mybatis-plus.global-config.db-config.id-type=auto
mybatis-plus.type-handlers-package=org.template.handler

# ===========================
# Knife4j Config
# ===========================
knife4j.enable=true
knife4j.setting.language=zh_cn

# ===========================
# Block Redis Service
# (@Value placeholders have no defaults -> startup fails if missing; if the
#  redis-config on Nacos already contains these 3 keys, this section can be removed)
# ===========================
block.redis.ttl=1800
block.redis.coldPlaceholder=__creating__
block.redis.dirtyPlaceholder=version:

#===
plugin.loader.enable = true
