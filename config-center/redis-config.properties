# =========================================================
# Local backup of Nacos config: DataId=redis-config (Group=DEFAULT_GROUP)
# Comments are ASCII-only: .properties files are read as ISO-8859-1
# by IDEA and Spring Boot, UTF-8 Chinese would turn to mojibake
# Update this file when the Nacos config changes
# =========================================================

spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.timeout=5000ms
spring.data.redis.lettuce.pool.max-active=8
spring.data.redis.lettuce.pool.max-wait=-1ms
spring.data.redis.lettuce.pool.max-idle=8
spring.data.redis.lettuce.pool.min-idle=0

# Block cache business params (injected via @Value in BlockRedisService,
# startup fails if missing)
block.redis.ttl=1800
block.redis.coldPlaceholder=__creating__
block.redis.dirtyPlaceholder=version:
